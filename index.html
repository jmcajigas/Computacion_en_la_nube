<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subida de archivo CSV</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <script src="https://unpkg.com/gijgo@1.9.14/js/gijgo.min.js" type="text/javascript"></script>
  <link href="https://unpkg.com/gijgo@1.9.14/css/gijgo.min.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="d-flex flex-column w-100">
    <div class="p-3 border border-primary rounded m-3 ">
      <h1>Subir archivo CSV</h1>
      <input type="file" id="csvFile" accept=".csv" />
      <button onclick="uploadCSV()">Subir</button>
      <p id="status"></p>
    </div>
    <div class="p-3">


      <div class="d-flex flex-row mb-5">
        <div class="mx-3">
          <label>Fecha Inicial</label>
          <input id="datepickerInicial" width="276" />
        </div>
        <div class="mx-3">
          <label>Fecha Final</label>
          <input id="datepickerFinal" width="276" />
        </div>
      </div>

      <table class="table">
        <thead id="headersTable">
          <tr>
            <th scope='col'>#</th>
            <th scope='col'>fecha</th>
            <th scope='col'>producto</th>
            <th scope='col'>valor</th>
            <th scope='col'>descuento</th>
            <th scope='col'>cantidad</th>
            <th scope='col'>valorNeto</th>
          </tr>
        </thead>
        <tbody id="bodyTable">
        </tbody>
      </table>
    </div>
  </div>
  <script src="script.js"></script>
</body>

<script>
  $('#datepickerInicial').datepicker({
    uiLibrary: 'bootstrap4',
    format: 'yyyy-mm-dd'
  });

  $('#datepickerFinal').datepicker({
    uiLibrary: 'bootstrap4',
    format: 'yyyy-mm-dd'
  });

  document.addEventListener('DOMContentLoaded', function() { 
    initialLoad()
  });
</script>

</html>
